id: android.app.launch
version: 1
description: 启动指定的 Android 应用程序（通过包名）。
risk_level: low
reversible: true
requires_confirmation: false

input_schema:
  type: object
  required:
    - package_name
  additionalProperties: false
  properties:
    package_name:
      type: string
      description: "要启动的应用包名，例如 com.android.settings"

supported_platforms:
  - os: android
    arch: [arm64, arm, x86_64, x86]

bindings:
  android:
    adapter: binder-host-android
    method: app.launch
    verifier: app.is_running
    rollback: app.force_stop

success_criteria:
  - field: launched
    equals_value: true

rollback:
  strategy: restore_previous_value