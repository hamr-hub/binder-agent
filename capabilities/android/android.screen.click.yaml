id: android.screen.click
version: 1
description: 在 Android 屏幕的指定坐标点击。
risk_level: medium
reversible: false
requires_confirmation: true

input_schema:
  type: object
  required:
    - x
    - y
  additionalProperties: false
  properties:
    x:
      type: integer
      description: "屏幕 X 坐标"
    y:
      type: integer
      description: "屏幕 Y 坐标"

supported_platforms:
  - os: android
    arch: [arm64, arm, x86_64, x86]

bindings:
  android:
    adapter: binder-host-android
    method: screen.click

success_criteria:
  - field: clicked
    equals_value: true

rollback:
  strategy: none