id: android.screen.screenshot
version: 1
description: 捕获当前屏幕截图。
risk_level: read_only
reversible: false
requires_confirmation: false

input_schema:
  type: object
  additionalProperties: false
  properties: {}

supported_platforms:
  - os: linux
    arch: [amd64, arm64]
  - os: darwin
    arch: [amd64, arm64]

bindings:
  android:
    adapter: binder-host-android
    method: screen.screenshot

success_criteria:
  - field: screenshot_path
    exists: true

rollback:
  strategy: none
