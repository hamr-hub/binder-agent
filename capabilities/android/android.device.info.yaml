id: android.device.info
version: 1
description: 获取 Android 设备的基础信息（型号、版本、电池等）。
risk_level: read_only
reversible: false
requires_confirmation: false

input_schema:
  type: object
  additionalProperties: false
  properties: {}

supported_platforms:
  - os: linux
    arch: [amd64, arm64]
  - os: darwin
    arch: [amd64, arm64]

bindings:
  android:
    adapter: binder-host-android
    method: device.get_info

success_criteria:
  - field: model
    exists: true
  - field: version
    exists: true

rollback:
  strategy: none
