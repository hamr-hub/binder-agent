id: android.key.event
version: 1
description: 模拟物理按键点击（返回、主页、菜单等）。
risk_level: low_risk
reversible: false
requires_confirmation: false

input_schema:
  type: object
  required:
    - key_code
  additionalProperties: false
  properties:
    key_code:
      type: string
      enum: [BACK, HOME, MENU, VOLUME_UP, VOLUME_DOWN, POWER]
      description: "按键名称"

supported_platforms:
  - os: linux
    arch: [amd64, arm64]
  - os: darwin
    arch: [amd64, arm64]

bindings:
  android:
    adapter: binder-host-android
    method: key.event

success_criteria:
  - field: key_pressed
    equals: true

rollback:
  strategy: none
